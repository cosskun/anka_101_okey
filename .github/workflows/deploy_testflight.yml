name: Deploy to TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  register-bundle-id:
    name: Register Bundle ID on Apple Developer
    runs-on: ubuntu-latest
    steps:
      - name: Register com.anka.okey101 via App Store Connect API
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          sudo gem install jwt --no-document
          ruby -e '
            require "jwt"
            require "net/http"
            require "json"
            require "openssl"
            require "base64"

            key_id = ENV["APP_STORE_CONNECT_KEY_ID"].to_s.strip
            issuer_id = ENV["APP_STORE_CONNECT_ISSUER_ID"].to_s.strip
            raw_key = ENV["APP_STORE_CONNECT_PRIVATE_KEY"].to_s.strip
            pem = raw_key.include?("-----BEGIN") ? raw_key : Base64.decode64(raw_key)

            ec_key = OpenSSL::PKey::EC.new(pem)
            token = JWT.encode({ iss: issuer_id, exp: Time.now.to_i + 1200, aud: "appstoreconnect-v1" }, ec_key, "ES256", { kid: key_id, typ: "JWT" })
            headers = { "Authorization" => "Bearer #{token}", "Content-Type" => "application/json" }

            identifier = "com.anka.okey101"
            name = "Anka 101 Okey"

            uri = URI("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=#{identifier}")
            res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(Net::HTTP::Get.new(uri, headers)) }
            if res.code == "200"
              data = JSON.parse(res.body)["data"] || []
              if data.any? { |b| b.dig("attributes", "identifier") == identifier }
                puts "Bundle ID #{identifier} already registered!"
                exit 0
              end
            end

            post_uri = URI("https://api.appstoreconnect.apple.com/v1/bundleIds")
            body = { data: { type: "bundleIds", attributes: { identifier: identifier, name: name, platform: "IOS" } } }.to_json
            post_res = Net::HTTP.start(post_uri.hostname, post_uri.port, use_ssl: true) do |http|
              req = Net::HTTP::Post.new(post_uri, headers)
              req.body = body
              http.request(req)
            end
            puts "Register response (#{post_res.code}): #{post_res.body}"
            exit(post_res.code == "201" ? 0 : 1)
          '

  deploy-testflight:
    name: Build & Upload to TestFlight
    needs: register-bundle-id
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Prepare Flutter iOS Workspace
        run: flutter build ios --release --no-codesign

      - name: Run Fastlane & Deploy to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '8'
        run: |
          cd ios
          fastlane beta

      - name: Upload Signed IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anka101Okey-iOS-IPA
          path: ios/build/anka_101_okey.ipa
          if-no-files-found: ignore
